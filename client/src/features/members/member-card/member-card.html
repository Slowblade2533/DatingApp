@if (member(); as member) {
  <div
    [routerLink]="['/members', member.id]"
    class="card bg-base-100 shadow-md border border-gray-100 transition-all hover:scale-105 hover:shadow-xl cursor-pointer w-full lg:w-75 xl:w-75 mx-auto"
  >
    <figure class="w-full relative">
      <img
        [src]="member?.imageUrl || '/user.png'"
        [alt]="member.displayName + '\'s profile photo'"
        class="w-full h-full object-cover"
      />
    </figure>

    <div class="card-body p-2">
      <h2 class="card-title text-lg font-semibold truncate">
        {{ member.displayName }}, {{ member.dateOfBirth | age }}
      </h2>
      <p class="text-md text-gray-500 truncate">{{ member.city }}</p>
    </div>
  </div>
}
