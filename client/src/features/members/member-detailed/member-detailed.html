@if (memberService.member(); as member) {
  <div class="flex gap-6">
    <!-- ฝั่งซ้าย: ข้อมูลส่วนตัว (คงที่) -->
    <div class="card bg-base-100 shadow-md border border-gray-100 flex flex-col h-full">
      <img
        [src]="member.imageUrl || '/user.png'"
        alt="image of member"
        class="rounded-full mx-10 mt-3 h-40 w-40 object-cover"
      />
      <div class="card-body">
        <div class="flex flex-col items-center">
          <div class="flex text-2xl text-primary">
            {{ member.displayName }}, {{ member.dateOfBirth | age }}
          </div>
          <div class="text-sm">{{ member.city }}, {{ member.country }}</div>
        </div>
        <div class="divider"></div>
        <ul class="menu rounded-box w-full text-xl">
          <li><a routerLink="profile" routerLinkActive="text-primary">Profile</a></li>
          <li><a routerLink="photos" routerLinkActive="text-primary">Photos</a></li>
          <li><a routerLink="messages" routerLinkActive="text-primary">Messages</a></li>
        </ul>
      </div>
      <div class="card-actions justify-between gap-2 px-4 mb-4 mt-auto">
        <button class="btn btn-info flex-1">Go back</button>
        <button class="btn btn-primary flex-1">Like User</button>
      </div>
    </div>
    <!-- ฝั่งขวา: เนื้อหา (Router Outlet) -->
    <div class="card bg-base-100 shadow-md border border-gray-100 p-6 flex flex-col w-150 h-full">
      <div class="flex justify-between items-center shrink-0">
        <h3 class="card-title text-3xl text-primary">{{ title() }}</h3>
        @if (isCurrentUser()) {
          <button
            (click)="memberService.editMode.set(!memberService.editMode())"
            class="btn btn-outline btn-primary"
          >
            {{ memberService.editMode() ? 'Cancel' : 'Edit' }}
          </button>
        }
      </div>
      <div class="divider shrink-0"></div>
      <!-- ส่วนแสดงผลเนื้อหาที่จะคงที่เสมอ -->
      <div class="grow overflow-y-auto min-h-0 pr-2">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
} @else {
  <div>Member not found</div>
}
